  <div>
    <label>密碼</label> <input type="password" name="password" required />
  </div>
  <div><button type="submit">註冊</button></div>
</form>

  <div>
    <label>密碼</label> <input type="password" name="password" required />
  </div>
  <div><button type="submit">登入</button></div>
</form>
