{% extends "base.html" %} {% block title %}Member{% endblock %} {% block header
%}歡迎光臨，這是會員頁{% endblock %} {% block content %}
<div>{{ member["name"] }}，歡迎登入系統</div>
<button onclick="logout();">登出系統</button>

<hr />

<div style="font-weight: bold">快來留言吧</div>
<form id="messageForm" action="/createMessage" method="post">
  <div><label>內容</label> <input type="text" name="content" required /></div>
  <div><button type="submit">送出</button></div>
</form>

<hr />

<div id="messageDiv" style="flex-direction: column"></div>

<script>
  async function checkStatus() {
    let response = await fetch("/login", { method: "GET" });
    let result = await response.json();
    if (result.ok) {
    } else {
      window.location = "/";
    }
  }
  checkStatus();
</script>

<script>
  async function logout() {
    let response = await fetch("/logout");
    let result = await response.json();
    if (result.ok) window.location = "/";
  }
</script>

<script>
  async function getMessages() {
    // 先確認登入者
    let loginRes = await fetch("/login");
    let loginData = await loginRes.json();
    let myId = loginData.ok ? loginData.id : null;

    // 再取得留言
    let response = await fetch("/createMessage");
    let result = await response.json();

    let messageDiv = document.querySelector("#messageDiv");
    messageDiv.innerHTML = "";

    for (let i = 0; i < result.length; i++) {
      let message = document.createElement("div");
      message.textContent = result[i].name + ":" + result[i].content;

      // 只有自己的留言才顯示刪除按鈕
      if (result[i].member_id === myId) {
        let deleteButton = document.createElement("button");
        deleteButton.textContent = "x";
        deleteButton.onclick = () => deleteMessage(result[i].id);
        message.appendChild(deleteButton);
      }

      messageDiv.appendChild(message);
    }
  }

  getMessages();
</script>

<script>
  async function deleteMessage(id) {
    let response = await fetch("/deleteMessage/" + id, { method: "POST" });
    let result = await response.json();
    if (result.ok) {
      getMessages();
    }
  }
</script>
{% endblock %}
